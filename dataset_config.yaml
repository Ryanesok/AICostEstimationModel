# Dataset configuration for model_pipeline.py and app.py
#
# Each entry maps a CSV filename stem (lowercase) to:
#   features:     list of input columns (must match CSV column names exactly, order matters for model)
#   target:       output column to predict
#   effort_unit:  unit of the target column — "person-months" or "person-hours"
#                 app.py akan otomatis mengonversi person-hours ke person-months (÷ 160)
#   labels:       (optional) friendly display names for each feature column in the GUI
#   hints:        (optional) helper text shown below each input field in the GUI
#
# Run auto_configure.py to automatically add new datasets from the data/ folder.

datasets:
  cocomo-81:
    effort_unit: person-months
    features:
    - rely
    - data
    - cplx
    - time
    - stor
    - virt
    - turn
    - acap
    - aexp
    - pcap
    - vexp
    - lexp
    - modp
    - tool
    - sced
    - loc
    target: actual
    labels:
      rely: "Reliability (Rely)"
      data: "Database Size (Data)"
      cplx: "Complexity (Cplx)"
      time: "Time Constraint (Time)"
      stor: "Storage Constraint (Stor)"
      virt: "VM Volatility (Virt)"
      turn: "Turnaround Time (Turn)"
      acap: "Analyst Capability (Acap)"
      aexp: "App Experience (Aexp)"
      pcap: "Programmer Capability (Pcap)"
      vexp: "VM Experience (Vexp)"
      lexp: "Language Experience (Lexp)"
      modp: "Modern Programming (Modp)"
      tool: "Software Tools (Tool)"
      sced: "Schedule (Sced)"
      loc: "LOC (ribuan baris)"
    hints:
      rely: "Reliabilitas yang dibutuhkan: 0.75 (rendah) | 1.00 (nominal) | 1.15 (tinggi) | 1.40 (sangat tinggi)"
      data: "Rasio ukuran database: 0.94 (kecil) | 1.00 (nominal) | 1.08 (besar) | 1.16 (sangat besar)"
      cplx: "Kompleksitas produk: 0.70 (rendah) | 1.00 (nominal) | 1.30 (tinggi) | 1.65 (sangat tinggi)"
      time: "Batasan waktu eksekusi CPU: 1.00 (nominal) | 1.11 (sedikit) | 1.30 (sedang) | 1.66 (ekstrem)"
      stor: "Batasan memori utama: 1.00 (nominal) | 1.06 (sedikit) | 1.21 (sedang) | 1.56 (ekstrem)"
      virt: "Keberubahan mesin virtual: 0.87 (rendah) | 1.00 (nominal) | 1.15 (sedang) | 1.30 (tinggi)"
      turn: "Waktu respons komputer: 0.87 (cepat) | 1.00 (nominal) | 1.07 (sedang) | 1.15 (lambat)"
      acap: "Kemampuan analis: 1.46 (sangat tinggi) | 1.19 (tinggi) | 1.00 (nominal) | 0.86 (rendah) | 0.71 (sangat rendah)"
      aexp: "Pengalaman di domain aplikasi: 1.29 (berpengalaman) | 1.00 (nominal) | 0.91 (sedikit) | 0.82 (baru)"
      pcap: "Kemampuan programmer: 1.42 (sangat tinggi) | 1.17 (tinggi) | 1.00 (nominal) | 0.86 (rendah) | 0.70 (sangat rendah)"
      vexp: "Pengalaman mesin virtual: 1.21 (< 6 bln) | 1.10 (6 bln) | 1.00 (1 thn) | 0.90 (3+ thn)"
      lexp: "Pengalaman bahasa pemrograman: 1.14 (< 6 bln) | 1.07 (6 bln) | 1.00 (1 thn) | 0.95 (3+ thn)"
      modp: "Praktik pemrograman modern: 1.24 (sangat rendah) | 1.00 (nominal) | 0.91 (tinggi) | 0.82 (sangat tinggi)"
      tool: "Penggunaan alat bantu SW: 1.24 (manual) | 1.10 (dasar) | 1.00 (nominal) | 0.91 (kuat) | 0.83 (canggih)"
      sced: "Target jadwal: 1.23 (dipercepat 75%) | 1.08 (90%) | 1.00 (nominal) | 1.04 (130%) | 1.10 (160%)"
