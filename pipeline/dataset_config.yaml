datasets:
  desharnais:
    features:
    - TeamExp
    - ManagerExp
    - Transactions
    - Entities
    target: Effort
    log_transform_target: true
    clip_outliers: false
    secondary_target: Length
    effort_unit: person-hours
    labels:
      TeamExp: Team Experience (tahun)
      ManagerExp: Manager Experience (tahun)
      Length: Durasi Proyek (bulan)
      Transactions: Jumlah Transaksi
      Entities: Jumlah Entitas Data
    hints:
      TeamExp: 'Pengalaman rata-rata tim dalam tahun. Contoh: 3'
      ManagerExp: 'Pengalaman manajer proyek dalam tahun. Contoh: 5'
      Length: 'Durasi total proyek dalam bulan. Contoh: 12'
      Transactions: 'Jumlah transaksi yang diproses sistem. Contoh: 45'
      Entities: 'Jumlah entitas dalam model data sistem. Contoh: 20'

  china:
    features:
    - AFP
    - Input
    - Output
    - Enquiry
    - File
    - Interface
    - Added
    - Changed
    - Deleted
    - Resource
    target: Effort
    log_transform_target: true
    clip_outliers: false
    secondary_target: Duration
    effort_unit: person-hours
    labels:
      AFP: Adjusted Function Points (AFP)
      Input: External Inputs (EI)
      Output: External Outputs (EO)
      Enquiry: External Enquiries (EQ)
      File: Internal Logical Files (ILF)
      Interface: External Interface Files (EIF)
      Added: FP Ditambahkan
      Changed: FP Dimodifikasi
      Deleted: FP Dihapus
      Resource: Jumlah Resource/Tim
    hints:
      AFP: 'Adjusted Function Points setelah faktor penyesuaian. Contoh: 215'
      Input: 'External Inputs — jumlah proses input dari luar sistem. Contoh: 10'
      Output: 'External Outputs — jumlah proses output ke luar sistem. Contoh: 8'
      Enquiry: 'External Enquiries — jumlah query input-output tanpa transformasi. Contoh: 12'
      File: 'Internal Logical Files — file yang dikelola oleh sistem. Contoh: 5'
      Interface: 'External Interface Files — file dari sistem eksternal. Contoh: 3'
      Added: 'Function Points yang ditambahkan (proyek enhancement). Contoh: 50'
      Changed: 'Function Points yang dimodifikasi (proyek enhancement). Contoh: 30'
      Deleted: 'Function Points yang dihapus (proyek enhancement). Contoh: 10'
      Resource: 'Jumlah resource/anggota tim: 1=kecil | 2=sedang | 3=besar | 4=sangat besar'

  kitchenham:
    features:
    - Adjusted.function.points
    - First.estimate
    target: Actual.effort
    log_transform_target: true
    clip_outliers: false
    secondary_target: Duration
    post_project_cols:
    - Actual.duration
    effort_unit: person-hours
    labels:
      Adjusted.function.points: Adjusted Function Points (AFP)
      First.estimate: Estimasi Awal Effort (person-hours)
    hints:
      Adjusted.function.points: 'Jumlah Function Points yang sudah disesuaikan (AFP). Contoh: 250'
      First.estimate: 'Estimasi effort awal sebelum proyek dimulai, dalam person-hours. Contoh: 1500'

  subbiah:
    features:
    - TotalUFP
    - ExternalInterface
    - ExternalInputs
    - ExternalOutputs
    - ExternalQueries
    - InternalLogicalFiles
    - Adjustment
    target: Actual_des
    log_transform_target: true
    clip_outliers: false
    effort_unit: person-hours
    notes: Subbiah Dataset - 72 proyek dengan Function Points metrics
    labels:
      TotalUFP: Total Unadjusted Function Points (UFP)
      ExternalInterface: External Interface Files (EIF)
      ExternalInputs: External Inputs (EI)
      ExternalOutputs: External Outputs (EO)
      ExternalQueries: External Enquiries (EQ)
      InternalLogicalFiles: Internal Logical Files (ILF)
      Adjustment: Adjustment Factor (AF)
    hints:
      TotalUFP: 'Total Unadjusted Function Points sebelum adjustment. Contoh: 200'
      ExternalInterface: 'External Interface Files yang dikelola oleh sistem eksternal. Contoh: 5'
      ExternalInputs: 'External Inputs untuk proses transformasi data. Contoh: 20'
      ExternalOutputs: 'External Outputs hasil transformasi. Contoh: 15'
      ExternalQueries: 'External Enquiries (input-output tanpa transformasi). Contoh: 10'
      InternalLogicalFiles: 'Internal Logical Files yang dikelola sistem. Contoh: 8'
      Adjustment: 'Adjustment Factor untuk menghitung AFP dari UFP. Contoh: 1.1'

  isbsg10:
    features:
    - FS
    - N_PDR
    - Resource_Level
    target: N_effort
    log_transform_target: true
    clip_outliers: false
    effort_unit: person-hours
    labels:
      FS: Functional Size (Function Points)
      N_PDR: Normalized Project Delivery Rate
      Resource_Level: Tingkat Resource Tim
    hints:
      FS: 'Ukuran fungsional proyek dalam Function Points. Contoh: 150'
      N_PDR: 'Normalized Project Delivery Rate (effort per FP). Contoh: 5.0'
      Resource_Level: 'Tingkat resource tim: 1=sangat kecil | 2=kecil | 3=sedang | 4=besar | 5=sangat besar'

  kemerer:
    features:
    - Hardware
    - KSLOC
    - AdjFP
    - RAWFP
    target: EffortMM
    log_transform_target: true
    clip_outliers: false
    secondary_target: Duration
    effort_unit: person-months
    labels:
      Hardware: Tipe Hardware
      KSLOC: Ukuran Sistem (KLOC)
      AdjFP: Adjusted Function Points (AFP)
      RAWFP: Unadjusted Function Points (UFP)
      Duration: Durasi Proyek (bulan)
    hints:
      Hardware: 'Tipe hardware: 1=PC | 2=Minicomputer | 3=Mainframe | 4=Workstation | 5=Multi | 6=Lainnya'
      KSLOC: 'Ukuran sistem dalam ribuan baris kode (KLOC). Contoh: 25'
      AdjFP: 'Adjusted Function Points setelah faktor penyesuaian. Contoh: 900'
      RAWFP: 'Unadjusted (Raw) Function Points sebelum adjustment. Contoh: 850'
      Duration: 'Durasi proyek dalam bulan kalender. Contoh: 14'

  miyazaki94:
    # Miyazaki 1994 dataset — 48 Japanese government MIS projects.
    # MM (man-months) is the effort target. SCRN/FORM/FILE are function-point
    # size components; ESCRN/EFORM/EFILE are their equivalent counts after
    # complexity adjustment. ID column excluded (not a predictor).
    # NOTE: models in models/miyazaki94_* were trained with wrong config
    # (target=SCRN, MM as feature). Must retrain after this fix.
    features:
    - KLOC
    - SCRN
    - FORM
    - FILE
    - ESCRN
    - EFORM
    - EFILE
    target: MM
    log_transform_target: true
    clip_outliers: false
    effort_unit: person-months
    labels:
      KLOC: Ukuran Sistem (KLOC)
      SCRN: Jumlah Screen/Report
      FORM: Jumlah Form Input
      FILE: Jumlah Master File
      ESCRN: Equivalent Screen Count
      EFORM: Equivalent Form Count
      EFILE: Equivalent File Count
    hints:
      KLOC: 'Ukuran sistem dalam ribuan baris kode. Contoh: 44.2'
      SCRN: 'Jumlah layar/laporan sistem. Contoh: 24'
      FORM: 'Jumlah form input. Contoh: 26'
      FILE: 'Jumlah master file. Contoh: 41'
      ESCRN: 'Equivalent screen count setelah adjustment kompleksitas. Contoh: 246'
      EFORM: 'Equivalent form count setelah adjustment kompleksitas. Contoh: 642'
      EFILE: 'Equivalent file count setelah adjustment kompleksitas. Contoh: 589'

  nasa93:
    # COCOMO effort estimation dataset — 93 NASA software projects.
    # act_effort (person-months) is the effort target. All COCOMO cost-driver
    # multipliers and equivphyskloc (size) are features.
    # NOTE: models in models/nasa93_* were trained with wrong config
    # (target=time, act_effort as feature). Must retrain after this fix.
    features:
    - mode
    - rely
    - data
    - cplx
    - time
    - stor
    - virt
    - turn
    - acap
    - aexp
    - pcap
    - vexp
    - lexp
    - modp
    - tool
    - sced
    - equivphyskloc
    target: act_effort
    log_transform_target: true
    clip_outliers: false
    effort_unit: person-months
    labels:
      mode: Development Mode (1=organic 2=semi-detached 3=embedded)
      rely: Required Reliability (Rely)
      data: Database Size (Data)
      cplx: Product Complexity (Cplx)
      time: Execution Time Constraint (Time)
      stor: Storage Constraint (Stor)
      virt: Virtual Machine Volatility (Virt)
      turn: Computer Turnaround (Turn)
      acap: Analyst Capability (Acap)
      aexp: Application Experience (Aexp)
      pcap: Programmer Capability (Pcap)
      vexp: VM Experience (Vexp)
      lexp: Language Experience (Lexp)
      modp: Modern Programming Practices (Modp)
      tool: Software Tools (Tool)
      sced: Schedule Constraint (Sced)
      equivphyskloc: System Size (KLOC)
    hints:
      mode: 'Mode pengembangan: 1=organik (kecil) | 2=semi-detached | 3=embedded (besar)'
      rely: 'Reliabilitas: 0.75=l | 0.88=n | 1.00=h | 1.15=vh | 1.40=xh'
      data: 'Ukuran DB relatif: 0.94=l | 1.00=n | 1.08=h | 1.16=vh'
      cplx: 'Kompleksitas: 0.70=vl | 0.85=l | 1.00=n | 1.15=h | 1.30=vh | 1.65=xh'
      time: 'Batasan waktu eksekusi: 1.00=n | 1.11=h | 1.30=vh | 1.66=xh'
      stor: 'Batasan memori: 1.00=n | 1.06=h | 1.21=vh | 1.56=xh'
      virt: 'Volatilitas VM: 0.87=l | 1.00=n | 1.15=h | 1.30=vh'
      turn: 'Turnaround komputer: 0.87=l | 1.00=n | 1.07=h | 1.15=vh'
      acap: 'Kemampuan analis: 1.46=vl | 1.19=l | 1.00=n | 0.86=h | 0.71=vh'
      aexp: 'Pengalaman aplikasi: 1.29=vl | 1.13=l | 1.00=n | 0.91=h | 0.82=vh'
      pcap: 'Kemampuan programmer: 1.42=vl | 1.17=l | 1.00=n | 0.86=h | 0.70=vh'
      vexp: 'Pengalaman VM: 1.21=vl | 1.10=l | 1.00=n | 0.90=h'
      lexp: 'Pengalaman bahasa: 1.14=vl | 1.07=l | 1.00=n | 0.95=h'
      modp: 'Praktik pemrograman modern: 1.24=vl | 1.10=l | 1.00=n | 0.91=h | 0.82=vh'
      tool: 'Alat bantu software: 1.24=vl | 1.10=l | 1.00=n | 0.91=h | 0.82=vh'
      sced: 'Jadwal: 1.23=ms | 1.08=s | 1.00=n | 1.04=l | 1.10=ml'
      equivphyskloc: 'Ukuran sistem dalam KLOC (ribuan baris kode). Contoh: 25.9'
