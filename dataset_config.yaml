datasets:
  desharnais:
    features:
    - TeamExp
    - ManagerExp
    - Transactions
    - Entities
    target: Effort
    secondary_target: Length
    labels:
      TeamExp: Team Experience (tahun)
      ManagerExp: Manager Experience (tahun)
      Length: Durasi Proyek (bulan)
      Transactions: Jumlah Transaksi
      Entities: Jumlah Entitas Data
    hints:
      TeamExp: 'Pengalaman rata-rata tim dalam tahun. Contoh: 3'
      ManagerExp: 'Pengalaman manajer proyek dalam tahun. Contoh: 5'
      Length: 'Durasi total proyek dalam bulan. Contoh: 12'
      Transactions: 'Jumlah transaksi yang diproses sistem. Contoh: 45'
      Entities: 'Jumlah entitas dalam model data sistem. Contoh: 20'
    effort_unit: person-hours
  china:
    features:
    - AFP
    - Input
    - Output
    - Enquiry
    - File
    - Interface
    - Added
    - Changed
    - Deleted
    - Resource
    target: Effort
    secondary_target: Duration
    labels:
      AFP: Adjusted Function Points (AFP)
      Input: External Inputs (EI)
      Output: External Outputs (EO)
      Enquiry: External Enquiries (EQ)
      File: Internal Logical Files (ILF)
      Interface: External Interface Files (EIF)
      Added: FP Ditambahkan
      Changed: FP Dimodifikasi
      Deleted: FP Dihapus
      Resource: Jumlah Resource/Tim
    hints:
      AFP: 'Adjusted Function Points setelah faktor penyesuaian. Contoh: 215'
      Input: 'External Inputs — jumlah proses input dari luar sistem. Contoh: 10'
      Output: 'External Outputs — jumlah proses output ke luar sistem. Contoh: 8'
      Enquiry: 'External Enquiries — jumlah query input-output tanpa transformasi. Contoh: 12'
      File: 'Internal Logical Files — file yang dikelola oleh sistem. Contoh: 5'
      Interface: 'External Interface Files — file dari sistem eksternal. Contoh: 3'
      Added: 'Function Points yang ditambahkan (proyek enhancement). Contoh: 50'
      Changed: 'Function Points yang dimodifikasi (proyek enhancement). Contoh: 30'
      Deleted: 'Function Points yang dihapus (proyek enhancement). Contoh: 10'
      Resource: 'Jumlah resource/anggota tim: 1=kecil | 2=sedang | 3=besar | 4=sangat besar'
    effort_unit: person-hours
  kitchenham:
    features:
    - Adjusted.function.points
    - First.estimate
    target: Actual.effort
    post_project_cols:
    - Actual.duration
    labels:
      Adjusted.function.points: Adjusted Function Points (AFP)
      First.estimate: Estimasi Awal Effort (person-hours)
    hints:
      Adjusted.function.points: 'Jumlah Function Points yang sudah disesuaikan (AFP). Contoh: 250'
      First.estimate: 'Estimasi effort awal sebelum proyek dimulai, dalam person-hours. Contoh: 1500'
    effort_unit: person-hours
